name: Scheduled Weather Data Ingestion

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: # Enable manual trigger from GitHub UI

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/ingestionPipeline/package-lock.json'

      - name: Install Ingestion Dependencies
        run: |
          cd backend/ingestionPipeline
          npm install

      - name: Run Weather Ingestion Pipeline
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MODEL: "Xenova/bge-small-en-v1.5"
          AI_TRANSLATE_API_KEY: ${{ secrets.AI_TRANSLATE_API_KEY }}
        run: |
          cd backend/ingestionPipeline
          node main.js
